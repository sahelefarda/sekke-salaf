<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
تحلیل اوراق عسکه2
</title>

<style>

body{
font-family:tahoma;
background:#1e293b;
color:#e2e8f0;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
background:#334155;
padding:20px;
border-radius:16px;
}

.card{
background:#0f172a;
padding:14px;
border-radius:12px;
margin-top:12px;
}

input{
width:100%;
padding:10px;
margin-top:5px;
border-radius:8px;
border:none;
background:#475569;
color:white;
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#3b82f6;
}

.positive{
color:#22c55e;
border-right:5px solid #22c55e;
}

.negative{
color:#ef4444;
border-right:5px solid #ef4444;
}

</style>

</head>

<body>

<div class="container">

<h2>
تحلیل اوراق سلف موازی سکه
</h2>

<div class="card">

قیمت تضمینی هر سکه:

<b>
252,199,000 تومان
</b>

<br><br>

قیمت تضمینی هر ورقه:

<b>
252,199 تومان
</b>

</div>

<label>

قیمت روز سکه

</label>

<input id="goldPrice">

<button onclick="loadMarketPrice()">

دریافت قیمت از بازار

</button>

<label>

قیمت بازار ورقه عسکه2

</label>

<input id="marketPrice">

<label>

نرخ بدون ریسک (%)

</label>

<input id="rate" value="30">

<label>

روزهای باقی مانده

</label>

<input id="days">

<button onclick="calculate()">

محاسبه

</button>

<div class="card">

ارزش فعلی مبلغ تضمینی:

<span id="pvGuarantee"></span>

</div>

<div class="card">

اختلاف ریالی:

<span id="diffAmount"></span>

</div>

<div class="card">

اختلاف درصدی:

<span id="diffPercent"></span>

</div>

<div class="card">

بازده تا سررسید:

<span id="holdingYield"></span>

</div>

<div class="card">

YTM:

<span id="annualYield"></span>

</div>

<div
id="strategy"
class="card">

هنوز محاسبه نشده است

</div>

</div>

<script>

const GUARANTEE_COIN =
252199000;

const GUARANTEE_CONTRACT =
252199;

function formatNumber(x){

return Math.round(x)
.toLocaleString("fa-IR");
}

async function loadMarketPrice(){

try{

const response =
await fetch(
"https://sekke-salaf.sahelefarda.workers.dev/"
);

const data =
await response.json();

if(data.goldPrice){

document
.getElementById(
"goldPrice"
)
.value =
Math.round(
data.goldPrice/10
);

alert(
"قیمت بازار دریافت شد"
);

}else{

alert(
"اطلاعاتی یافت نشد"
);

}

}catch(e){

alert(
"خطا در دریافت اطلاعات"
);

}

}

function calculate(){

let marketPrice =
parseFloat(
document
.getElementById(
"marketPrice"
).value
);

let rate =
parseFloat(
document
.getElementById(
"rate"
).value
)/100;

let days =
parseFloat(
document
.getElementById(
"days"
).value
);

const pvGuarantee =
GUARANTEE_CONTRACT /
Math.pow(
1+rate,
days/365
);

const diff =
pvGuarantee -
marketPrice;

const diffPercent =
(diff/pvGuarantee)*100;

const holdingYield =
(
GUARANTEE_CONTRACT /
marketPrice
-1
)*100;

const annualYield =
(
Math.pow(
GUARANTEE_CONTRACT/
marketPrice,
365/days
)-1
)*100;

document.getElementById(
"pvGuarantee"
).innerHTML=
formatNumber(
pvGuarantee
);

document.getElementById(
"diffAmount"
).innerHTML=
formatNumber(
Math.abs(diff)
);

document.getElementById(
"diffPercent"
).innerHTML=
Math.abs(
diffPercent
).toFixed(2)+"%";

document.getElementById(
"holdingYield"
).innerHTML=
holdingYield.toFixed(2)+"%";

document.getElementById(
"annualYield"
).innerHTML=
annualYield.toFixed(2)+"%";

let strategy =
document.getElementById(
"strategy"
);

if(
marketPrice<
pvGuarantee
){

strategy.className=
"card positive";

strategy.innerHTML=
"✅ خرید و نگهداری تا سررسید قابل بررسی است. بازده از نرخ بدون ریسک بیشتر است.";

}else{

strategy.className=
"card negative";

strategy.innerHTML=
"❌ سرمایه‌گذاری بدون ریسک جذاب‌تر است. اوراق بالاتر از ارزش منصفانه معامله می‌شود.";

}

}

</script>

</body>
</html>

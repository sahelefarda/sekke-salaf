<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحلیل ارزندگی اوراق سکه</title>
<style>
:root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel2: #111827;
    --border: #334155;
    --gold: #fbbf24;
    --green: #22c55e;
    --red: #ef4444;
    --orange: #f59e0b;
    --text: #e5e7eb;
}

body {
    font-family: tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 1100px;
    margin: 25px auto;
    padding: 20px;
}

.card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 0 30px rgba(0,0,0,.35);
}

h1 {
    color: var(--gold);
    text-align: center;
    margin-bottom: 20px;
}

h2 {
    color: var(--gold);
    margin-top: 0;
}

.info {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
}

.info p {
    margin: 6px 0;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

@media(max-width:768px) {
    .grid, .summary-grid {
        grid-template-columns: 1fr !important;
    }
}

label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    color: #cbd5e1;
}

input {
    width: 100%;
    box-sizing: border-box;
    background: #0b1221;
    border: 1px solid #475569;
    color: white;
    padding: 12px;
    border-radius: 10px;
    font-size: 15px;
    direction: ltr;
    text-align: right;
}

input:focus {
    outline: none;
    border-color: var(--gold);
}

.btn {
    background: var(--gold);
    color: #111827;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    cursor: pointer;
    font-weight: bold;
    transition: opacity 0.2s, transform 0.1s;
}

.btn:hover {
    opacity: .9;
}

.btn:active {
    transform: scale(0.99);
}

.mainBtn {
    width: 100%;
    margin-top: 25px;
    font-size: 18px;
}

.result {
    margin-top: 25px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
}

.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 10px 0;
    padding: 10px;
    border-bottom: 1px solid #253247;
}

.value {
    color: var(--green);
    font-weight: bold;
}

.negative-val {
    color: var(--red);
    font-weight: bold;
}

.good {
    color: var(--green);
    font-size: 22px;
    font-weight: bold;
    margin-top: 15px;
    text-align: center;
}

.neutral {
    color: var(--orange);
    font-size: 22px;
    font-weight: bold;
    margin-top: 15px;
    text-align: center;
}

.bad {
    color: var(--red);
    font-size: 22px;
    font-weight: bold;
    margin-top: 15px;
    text-align: center;
}

.small {
    color: #94a3b8;
    font-size: 13px;
    margin-top: 5px;
}

.daysWrapper {
    display: flex;
    gap: 10px;
}

.daysWrapper input {
    flex: 1;
}

.winner-box {
    margin-top: 25px;
    padding: 18px;
    border-radius: 16px;
    background: rgba(34,197,94,.12);
    border: 2px solid #22c55e;
    display: flex;
    align-items: center;
    gap: 15px;
    box-shadow: 0 0 15px rgba(34,197,94,.30), 0 0 30px rgba(34,197,94,.15);
    animation: winnerGlow 2s infinite;
}

.winner-icon {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    border-radius: 50%;
    background: #22c55e;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
    animation: tickPop .6s ease-out;
}

.winner-title {
    color: #22c55e;
    font-size: 20px;
    font-weight: bold;
}

.winner-subtitle {
    color: #d1fae5;
    margin-top: 6px;
}

.winner-badge {
    background: #22c55e;
    color: #08120d;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    display: inline-block;
    margin-right: 8px;
}

.winning-row {
    background: rgba(34,197,94,.10);
    border: 1px solid rgba(34,197,94,.35);
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(34,197,94,.15);
}

.summary-card {
    margin-bottom: 20px;
    border-radius: 16px;
    padding: 18px;
    background: linear-gradient(135deg, rgba(251,191,36,.15), rgba(34,197,94,.12));
    border: 1px solid rgba(251,191,36,.35);
}

.summary-title {
    color: #fbbf24;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 12px;
}

.summary-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.summary-item {
    background: rgba(15, 23, 42, 0.6);
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
}

hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 18px 0;
}

@keyframes tickPop {
    0% { transform: scale(.2) rotate(-20deg); opacity: 0; }
    70% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
}

@keyframes winnerGlow {
    0%, 100% { box-shadow: 0 0 15px rgba(34,197,94,.20), 0 0 30px rgba(34,197,94,.10); }
    50% { box-shadow: 0 0 30px rgba(34,197,94,.60), 0 0 60px rgba(34,197,94,.25); }
}
</style>
</head>

<body>

<div class="card">

    <h1>تحلیل ارزندگی اوراق سکه</h1>

    <div class="info">
        <p><strong>ارزش تضمینی هر ورقه:</strong> ۲۵۲,۱۹۹ تومان</p>
        <p><strong>هر ورقه:</strong> معادل یک‌هزارم سکه</p>
        <p><strong>سررسید:</strong> ۱۸ آذر ۱۴۰۵</p>
        <p><strong>نرخ بدون ریسک پیش‌فرض:</strong> ۳۷٪</p>
    </div>

    <div class="grid">
        <div>
            <label for="bondPrice">قیمت بازار ورقه (تومان)</label>
            <input id="bondPrice" type="text" inputmode="numeric" value="245,000" placeholder="مثال: 245,000">
        </div>

        <div>
            <label for="coinPrice">قیمت روز سکه (تومان)</label>
            <input id="coinPrice" type="text" inputmode="numeric" value="290,000,000" placeholder="مثال: 290,000,000">
        </div>

        <div>
            <label for="riskFreeRate">نرخ بهره بدون ریسک سالانه (%)</label>
            <input id="riskFreeRate" type="text" inputmode="decimal" value="37">
        </div>

        <div>
            <label for="costs">هزینه اعمال و فروش هر ورقه (تومان)</label>
            <input id="costs" type="text" inputmode="numeric" value="0">
        </div>

        <div>
            <label for="daysToMaturity">روزهای باقیمانده تا سررسید</label>
            <div class="daysWrapper">
                <input id="daysToMaturity" type="text" inputmode="numeric" value="31">
                <button id="todayBtn" class="btn" type="button">امروز</button>
            </div>
            <div class="small">سررسید نهایی: ۱۸ آذر ۱۴۰۵ (۹ دسامبر ۲۰۲۶)</div>
        </div>
    </div>

    <button id="calcBtn" class="btn mainBtn" type="button">محاسبه ارزندگی</button>

    <div id="result" class="result">
        برای مشاهده تحلیل، اطلاعات را وارد کرده و دکمه محاسبه را بزنید.
    </div>

</div>

<script>
(function() {
    const GUARANTEED_VALUE = 252199;
    const MATURITY_DATE = new Date("2026-12-09T00:00:00");

    // تبدیل اعداد فارسی و عربی به انگلیسی و حذف ویرگول‌ها
    function parseCleanNumber(str) {
        if (str === null || str === undefined) return NaN;
        let s = String(str);
        const persianDigits = [/۰/g, /۱/g, /۲/g, /۳/g, /۴/g, /۵/g, /۶/g, /۷/g, /۸/g, /۹/g];
        const arabicDigits  = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
        for (let i = 0; i < 10; i++) {
            s = s.replace(persianDigits[i], i).replace(arabicDigits[i], i);
        }
        // تبدیل ممیز فارسی به نقطه و حذف جداکننده‌های هزارگان
        s = s.replace(/٫/g, '.').replace(/[,،\s]/g, '');
        return s === '' ? NaN : Number(s);
    }

    function setToday() {
        const now = new Date();
        now.setHours(0, 0, 0, 0);
        const diffTime = MATURITY_DATE - now;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        document.getElementById("daysToMaturity").value = Math.max(1, diffDays);
    }

    function formatNumber(value) {
        const rounded = Math.round(value);
        const absFormatted = Math.abs(rounded).toLocaleString("fa-IR");
        return rounded < 0 ? absFormatted + "-" : absFormatted;
    }

    function formatPercent(value) {
        const fixed = Math.abs(value).toFixed(2);
        return value < 0 ? fixed + "%-" : fixed + "%";
    }

    function annualizedYTM(futureValue, price, days) {
        if (price <= 0 || days <= 0) return 0;
        if (futureValue <= 0) return -100;
        return (Math.pow(futureValue / price, 365 / days) - 1) * 100;
    }

    function presentValue(futureValue, annualRatePercent, days) {
        const r = annualRatePercent / 100;
        if (r <= -1 || days <= 0) return futureValue;
        return futureValue / Math.pow(1 + r, days / 365);
    }

    function analyze() {
        const bondPrice = parseCleanNumber(document.getElementById("bondPrice").value);
        const coinPrice = parseCleanNumber(document.getElementById("coinPrice").value);
        const riskFreeRate = parseCleanNumber(document.getElementById("riskFreeRate").value) || 0;
        const costs = parseCleanNumber(document.getElementById("costs").value) || 0;
        const days = parseCleanNumber(document.getElementById("daysToMaturity").value);

        const resultBox = document.getElementById("result");

        if (isNaN(bondPrice) || bondPrice <= 0) {
            resultBox.innerHTML = '<span class="negative-val">لطفاً «قیمت بازار ورقه» را بزرگ‌تر از صفر وارد کنید.</span>';
            return;
        }
        if (isNaN(coinPrice) || coinPrice <= 0) {
            resultBox.innerHTML = '<span class="negative-val">لطفاً «قیمت روز سکه» را بزرگ‌تر از صفر وارد کنید.</span>';
            return;
        }
        if (isNaN(days) || days <= 0) {
            resultBox.innerHTML = '<span class="negative-val">لطفاً «روزهای باقیمانده تا سررسید» را بزرگ‌تر از صفر وارد کنید.</span>';
            return;
        }

        const guaranteedValue = GUARANTEED_VALUE;
        const exerciseValue = Math.max(0, (coinPrice / 1000) - costs);

        // ارزش در سررسید (بیشینه بین تضمینی و اعمال)
        const terminalPayoff = Math.max(guaranteedValue, exerciseValue);

        // ارزش فعلی منصفانه با تنزیل بر اساس نرخ بدون ریسک
        const discountedFairValue = presentValue(terminalPayoff, riskFreeRate, days);

        // سود ناخالص در سررسید و بازده دوره نگهداری
        const nominalMargin = terminalPayoff - bondPrice;
        const holdingReturnPercent = (nominalMargin / bondPrice) * 100;

        // اختلاف قیمت بازار با ارزش ذاتی امروز (تنزیل‌شده)
        const pvMargin = discountedFairValue - bondPrice;
        const pvUpsidePercent = (pvMargin / bondPrice) * 100;

        // محاسبه بازده سالانه (YTM)
        const guaranteedYTM = annualizedYTM(guaranteedValue, bondPrice, days);
        const exerciseYTM = annualizedYTM(exerciseValue, bondPrice, days);
        const selectedYTM = annualizedYTM(terminalPayoff, bondPrice, days);

        const spreadGuarantee = guaranteedYTM - riskFreeRate;
        const spreadExercise = exerciseYTM - riskFreeRate;
        const spreadSelected = selectedYTM - riskFreeRate;

        const guaranteeWinner = guaranteedValue > exerciseValue;
        const exerciseWinner = exerciseValue > guaranteedValue;

        let winnerLabel = "هر دو سناریو بازدهی یکسانی دارند";
        let winnerBadge = "سناریوهای برابر";

        if (exerciseWinner) {
            winnerLabel = "اعمال اوراق و دریافت سکه (ارزش ذاتی سکه بالاتر از کف تضمینی است)";
            winnerBadge = "سناریوی اعمال";
        } else if (guaranteeWinner) {
            winnerLabel = "بازخرید تضمینی نقدی (کف تضمینی بالاتر از ارزش روز سکه است)";
            winnerBadge = "سناریوی تضمینی";
        }

        let cls = "neutral";
        let status = "منصفانه (نزدیک به نرخ بدون ریسک)";

        if (spreadSelected >= 8) {
            cls = "good";
            status = "بسیار ارزنده (بازدهی بسیار بالاتر از نرخ بدون ریسک)";
        } else if (spreadSelected >= 2) {
            cls = "good";
            status = "ارزنده (دارای صرف ریسک مثبت)";
        } else if (spreadSelected <= -2) {
            cls = "bad";
            status = "گران (بازدهی کمتر از نرخ بهره بدون ریسک)";
        }

        resultBox.innerHTML = `
            <div class="summary-card">
                <div class="summary-title">خلاصه مدیریتی</div>
                <div class="summary-grid">
                    <div class="summary-item">
                        <div class="small">ارزش فعلی منصفانه (تنزیل‌شده امروز)</div>
                        <div class="value" style="font-size:18px; margin-top:4px;">${formatNumber(discountedFairValue)} تومان</div>
                    </div>
                    <div class="summary-item">
                        <div class="small">بازده تا سررسید سالانه (YTM منتخب)</div>
                        <div class="${selectedYTM >= riskFreeRate ? 'value' : 'negative-val'}" style="font-size:18px; margin-top:4px;">
                            ${formatPercent(selectedYTM)}
                        </div>
                    </div>
                </div>
            </div>

            <h2>جزئیات تحلیل</h2>

            <div class="row ${guaranteeWinner ? 'winning-row' : ''}">
                <span>
                    ارزش تضمینی در سررسید
                    ${guaranteeWinner ? '<span class="winner-badge">برنده</span>' : ''}
                </span>
                <span class="value">${formatNumber(guaranteedValue)} تومان</span>
            </div>

            <div class="row ${exerciseWinner ? 'winning-row' : ''}">
                <span>
                    ارزش خالص اعمال (معادل سکه پس از کسر هزینه‌ها)
                    ${exerciseWinner ? '<span class="winner-badge">برنده</span>' : ''}
                </span>
                <span class="value">${formatNumber(exerciseValue)} تومان</span>
            </div>

            <div class="row">
                <span>دریافتی نهایی در سررسید (بهترین سناریو)</span>
                <span class="value">${formatNumber(terminalPayoff)} تومان</span>
            </div>

            <div class="row">
                <span>سود/زیان اسمی در سررسید (بدون تنزیل)</span>
                <span class="${nominalMargin >= 0 ? 'value' : 'negative-val'}">
                    ${formatNumber(nominalMargin)} تومان (${formatPercent(holdingReturnPercent)})
                </span>
            </div>

            <div class="row">
                <span>حاشیه ایمنی نسبت به ارزش فعلی منصفانه (PV)</span>
                <span class="${pvMargin >= 0 ? 'value' : 'negative-val'}">
                    ${formatNumber(pvMargin)} تومان (${formatPercent(pvUpsidePercent)})
                </span>
            </div>

            <hr>

            <div class="row">
                <span>YTM سناریوی تضمینی</span>
                <span>${formatPercent(guaranteedYTM)}</span>
            </div>

            <div class="row">
                <span>اسپرد تضمینی نسبت به نرخ بدون ریسک</span>
                <span class="${spreadGuarantee >= 0 ? 'value' : 'negative-val'}">${formatPercent(spreadGuarantee)}</span>
            </div>

            <div class="row">
                <span>YTM سناریوی اعمال سکه</span>
                <span>${formatPercent(exerciseYTM)}</span>
            </div>

            <div class="row">
                <span>اسپرد اعمال نسبت به نرخ بدون ریسک</span>
                <span class="${spreadExercise >= 0 ? 'value' : 'negative-val'}">${formatPercent(spreadExercise)}</span>
            </div>

            <div class="row">
                <span>روزهای باقیمانده تا سررسید</span>
                <span>${formatNumber(days)} روز</span>
            </div>

            <div class="winner-box">
                <div class="winner-icon">✓</div>
                <div>
                    <div class="winner-title">
                        سناریوی منتخب
                        <span class="winner-badge">${winnerBadge}</span>
                    </div>
                    <div class="winner-subtitle">${winnerLabel}</div>
                </div>
            </div>

            <div class="${cls}">
                نتیجه نهایی: ${status}
            </div>
        `;
    }

    // فرمت خودکار سه‌رقمی برای فیلدهای مبالغ ریالی هنگام تایپ
    function attachThousandFormatter(id) {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener("input", function() {
            const num = parseCleanNumber(this.value);
            if (!isNaN(num) && this.value.trim() !== "") {
                this.value = num.toLocaleString("en-US");
            }
        });
    }

    // اتصال رویدادها پس از بارگذاری کامل DOM
    function init() {
        document.getElementById("calcBtn").addEventListener("click", analyze);
        document.getElementById("todayBtn").addEventListener("click", function() {
            setToday();
            analyze();
        });

        attachThousandFormatter("bondPrice");
        attachThousandFormatter("coinPrice");
        attachThousandFormatter("costs");

        // اجرای محاسبه با زدن کلید Enter روی هر یک از ورودی‌ها
        document.querySelectorAll("input").forEach(function(input) {
            input.addEventListener("keydown", function(e) {
                if (e.key === "Enter") {
                    e.preventDefault();
                    analyze();
                }
            });
        });

        setToday();
        analyze();
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
})();
</script>

</body>
</html>

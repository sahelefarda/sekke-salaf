<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تحلیل ارزندگی اوراق سکه</title>

<style>

:root{
    --bg:#0f172a;
    --panel:#1e293b;
    --panel2:#111827;
    --border:#334155;
    --gold:#fbbf24;
    --green:#22c55e;
    --red:#ef4444;
    --orange:#f59e0b;
    --text:#e5e7eb;
}

body{
    font-family:tahoma,sans-serif;
    background:var(--bg);
    color:var(--text);
    max-width:1100px;
    margin:25px auto;
    padding:20px;
}

.card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:24px;
    box-shadow:0 0 30px rgba(0,0,0,.35);
}

h1{
    color:var(--gold);
    text-align:center;
    margin-bottom:20px;
}

h2{
    color:var(--gold);
    margin-top:0;
}

.info{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:15px;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

@media(max-width:768px){
    .grid{
        grid-template-columns:1fr;
    }
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
    color:#cbd5e1;
}

input{
    width:100%;
    box-sizing:border-box;
    background:#0b1221;
    border:1px solid #475569;
    color:white;
    padding:12px;
    border-radius:10px;
}

input:focus{
    outline:none;
    border-color:var(--gold);
}

.btn{
    background:var(--gold);
    color:#111827;
    border:none;
    border-radius:10px;
    padding:12px 18px;
    cursor:pointer;
    font-weight:bold;
}

.btn:hover{
    opacity:.9;
}

.mainBtn{
    width:100%;
    margin-top:25px;
    font-size:18px;
}

.result{
    margin-top:25px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
}

.row{
    display:flex;
    justify-content:space-between;
    margin:10px 0;
    padding:8px 0;
    border-bottom:1px solid #253247;
}

.value{
    color:var(--green);
    font-weight:bold;
}

.good{
    color:var(--green);
    font-size:22px;
    font-weight:bold;
}

.neutral{
    color:var(--orange);
    font-size:22px;
    font-weight:bold;
}

.bad{
    color:var(--red);
    font-size:22px;
    font-weight:bold;
}

.small{
    color:#94a3b8;
    font-size:13px;
}

.daysWrapper{
    display:flex;
    gap:10px;
}

.daysWrapper input{
    flex:1;
}

</style>
</head>

<body>

<div class="card">

<h1>تحلیل ارزندگی اوراق سکه</h1>

<div class="info">

<p><strong>ارزش تضمینی هر ورقه:</strong> 252,199 تومان</p>

<p><strong>هر ورقه:</strong> معادل یک‌هزارم سکه</p>

<p><strong>سررسید:</strong> 18 آذر 1405</p>

<p><strong>نرخ بدون ریسک پیش‌فرض:</strong> 37٪</p>

</div>

<div class="grid">

<div>
<label>قیمت بازار ورقه (تومان)</label>
<input id="bondPrice" type="number" placeholder="مثال: 245000">
</div>

<div>
<label>قیمت روز سکه (تومان)</label>
<input id="coinPrice" type="number" placeholder="مثال: 290000000">
</div>

<div>
<label>نرخ بهره بدون ریسک (%)</label>
<input id="riskFreeRate" type="number" value="37">
</div>

<div>
<label>هزینه اعمال و فروش هر ورقه (تومان)</label>
<input id="costs" type="number" value="0">
</div>

<div>
<label>روزهای باقیمانده تا سررسید</label>

<div class="daysWrapper">

<input
id="daysToMaturity"
type="number"
value="31"
>

<button
class="btn"
onclick="setToday()">
امروز
</button>

</div>

<div class="small">
بر اساس 17 آبان 1405 تا سررسید 18 آذر 1405
</div>

</div>

</div>

<button
class="btn mainBtn"
onclick="analyze()">
محاسبه ارزندگی
</button>

<div id="result" class="result">

برای مشاهده تحلیل، اطلاعات را وارد کنید.

</div>

</div>

<script>

const GUARANTEED_VALUE = 252199;

function setToday(){

    document.getElementById(
        "daysToMaturity"
    ).value = 31;

}

function formatNumber(value){

    return Math.round(value)
    .toLocaleString("fa-IR");

}

function annualizedYTM(
    futureValue,
    price,
    days
){

    if(
        price <= 0 ||
        futureValue <= 0 ||
        days <= 0
    ){
        return 0;
    }

    return (
        Math.pow(
            futureValue / price,
            365 / days
        ) - 1
    ) * 100;
}

function analyze(){

    const bondPrice =
        Number(
            document.getElementById(
                "bondPrice"
            ).value
        );

    const coinPrice =
        Number(
            document.getElementById(
                "coinPrice"
            ).value
        );

    const riskFreeRate =
        Number(
            document.getElementById(
                "riskFreeRate"
            ).value
        );

    const costs =
        Number(
            document.getElementById(
                "costs"
            ).value
        );

    const days =
        Number(
            document.getElementById(
                "daysToMaturity"
            ).value
        );

    if(
        bondPrice <= 0 ||
        coinPrice <= 0 ||
        days <= 0
    ){
        document.getElementById(
            "result"
        ).innerHTML =
        "لطفاً همه مقادیر را وارد کنید.";
        return;
    }

    const guaranteedValue =
        GUARANTEED_VALUE;

    const exerciseValue =
        (coinPrice / 1000)
        - costs;

    const fairValue =
        Math.max(
            guaranteedValue,
            exerciseValue
        );

    const margin =
        fairValue - bondPrice;

    const upsidePercent =
        (margin / bondPrice)
        * 100;

    const guaranteedYTM =
        annualizedYTM(
            guaranteedValue,
            bondPrice,
            days
        );

    const exerciseYTM =
        annualizedYTM(
            exerciseValue,
            bondPrice,
            days
        );

    const selectedYTM =
        annualizedYTM(
            fairValue,
            bondPrice,
            days
        );

    const spreadGuarantee =
        guaranteedYTM -
        riskFreeRate;

    const spreadExercise =
        exerciseYTM -
        riskFreeRate;

    let source;

    if(
        exerciseValue >
        guaranteedValue
    ){

        source =
        "اعمال اوراق و دریافت سکه";

    }
    else if(
        exerciseValue <
        guaranteedValue
    ){

        source =
        "بازخرید تضمینی";

    }
    else{

        source =
        "هر دو برابر";

    }

    let cls =
        "neutral";

    let status =
        "منصفانه";

    if(
        upsidePercent >= 10
    ){

        cls = "good";
        status =
        "بسیار ارزنده";

    }
    else if(
        upsidePercent >= 3
    ){

        cls = "good";
        status =
        "ارزنده";

    }
    else if(
        upsidePercent <= -3
    ){

        cls = "bad";
        status =
        "گران";

    }

    document.getElementById(
        "result"
    ).innerHTML = `

        <h2>نتایج تحلیل</h2>

        <div class="row">
        <span>ارزش تضمینی ورقه</span>
        <span class="value">
        ${formatNumber(
            guaranteedValue
        )} تومان
        </span>
        </div>

        <div class="row">
        <span>ارزش اعمال ورقه</span>
        <span class="value">
        ${formatNumber(
            exerciseValue
        )} تومان
        </span>
        </div>

        <div class="row">
        <span>مبنای ارزش‌گذاری</span>
        <span>
        ${source}
        </span>
        </div>

        <div class="row">
        <span>ارزش منصفانه</span>
        <span class="value">
        ${formatNumber(
            fairValue
        )} تومان
        </span>
        </div>

        <div class="row">
        <span>اختلاف ریالی</span>
        <span>
        ${formatNumber(
            margin
        )} تومان
        </span>
        </div>

        <div class="row">
        <span>درصد ارزندگی</span>
        <span>
        ${upsidePercent.toFixed(2)}%
        </span>
        </div>

        <hr>

        <div class="row">
        <span>
        YTM سناریوی تضمینی
        </span>
        <span>
        ${guaranteedYTM.toFixed(2)}%
        </span>
        </div>

        <div class="row">
        <span>
        اسپرد نسبت به نرخ بدون ریسک
        </span>
        <span>
        ${spreadGuarantee.toFixed(2)}%
        </span>
        </div>

        <div class="row">
        <span>
        YTM سناریوی اعمال
        </span>
        <span>
        ${exerciseYTM.toFixed(2)}%
        </span>
        </div>

        <div class="row">
        <span>
        اسپرد نسبت به نرخ بدون ریسک
        </span>
        <span>
        ${spreadExercise.toFixed(2)}%
        </span>
        </div>

        <div class="row">
        <span>
        YTM سناریوی منتخب
        </span>
        <span class="value">
        ${selectedYTM.toFixed(2)}%
        </span>
        </div>

        <div class="row">
        <span>
        روز تا سررسید
        </span>
        <span>
        ${days}
        </span>
        </div>

        <br>

        <div class="${cls}">
        نتیجه نهایی: ${status}
        </div>

    `;
}

</script>

</body>
</html>
